<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casual Studio</title>
    <style>
        :root {
            --bg-color: #faf9f6;
            --text-color: #2b2b2b;
            --accent-color: #6e7f73;
            --card-bg: #ffffff;
            --border-color: #e5e5e3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; }
        .cart-icon-btn { background: #6e7f73; color: white; border: none; font-size: 1rem; cursor: pointer; padding: 0.6rem 1.2rem; border-radius: 4px; }
        .hero { text-align: center; padding: 4rem 2rem; background-color: #f1f0ea; margin-bottom: 2rem; }
        .hero h2 { font-size: 2.2rem; font-weight: 500; margin-bottom: 0.5rem; }
        .hero p { font-size: 1rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.1rem; color: var(--accent-color); font-weight: 600; margin-bottom: 1rem; }
        .size-selector { margin-bottom: 1rem; width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; }
        .add-to-cart-btn { width: 100%; background: var(--text-color); color: white; border: none; padding: 0.7rem; cursor: pointer; border-radius: 4px; }
        .cart-sidebar { position: fixed; top: 0; right: -450px; width: 100%; max-width: 420px; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); z-index: 1000; transition: right 0.3s ease; display: flex; flex-direction: column; }
        .cart-sidebar.open { right: 0; }
        .cart-header { padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-items-list { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .cart-footer { padding: 1.5rem; border-top: 1px solid var(--border-color); background: #fafafa; }
        .checkout-btn { width: 100%; background: var(--accent-color); color: white; border: none; padding: 1rem; cursor: pointer; font-size: 1rem; border-radius: 4px; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>CASUAL.Studio</h1>
            <button class="cart-icon-btn" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <section class="hero">
        <h2>CASUAL.Studio</h2>
        <p>Built for Casuality, Not for Street</p>
    </section>

    <main class="main-container">
        <div class="product-grid" id="product-grid"></div>
    </main>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Shopping Bag</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items-list" id="cart-items-list"></div>
        <div class="cart-footer">
            <h3 style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                <span>Total:</span> <span id="cart-total">0 MMK</span>
            </h3>
            <button class="checkout-btn" onclick="checkout()">Checkout Order</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "proto 001", price: 25000 },
            { id: 2, name: "proto 002", price: 28000 },
            { id: 3, name: "proto 003", price: 32000 },
            { id: 4, name: "proto 004", price: 22000 },
            { id: 5, name: "proto 005", price: 35000 },
            { id: 6, name: "product 01", price: 40000 }
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('product-grid');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString()} MMK</div>
                    </div>
                    <div>
                        <select class="size-selector" id="size-${p.id}">
                            <option value="S">S</option>
                            <option value="M" selected>M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = document.getElementById(`size-${id}`).value;
            const itemKey = `${id}-${size}`;
            
            const existing = cart.find(item => item.itemKey === itemKey);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, size, qty: 1, itemKey });
            }
            updateUI();
        }

        function remove(itemKey) {
            cart = cart.filter(item => item.itemKey !== itemKey);
            updateUI();
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.reduce((total, item) => total + item.qty, 0);
            
            const list = document.getElementById('cart-items-list');
            if(cart.length === 0) {
                list.innerHTML = '<p style="color:#888; text-align:center;">Your cart is completely empty.</p>';
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong> (${item.size})<br>
                            ${item.price.toLocaleString()} MMK &times; ${item.qty}
                        </div>
                        <button class="close-btn" style="color:red; font-size:1rem;" onclick="remove('${item.itemKey}')">Remove</button>
                    </div>
                `).join('');
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = total.toLocaleString() + ' MMK';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Your shopping bag is completely empty.');
                return;
            }
            const summary = cart.map(i => `${i.name} [Size ${i.size}] x${i.qty}`).join('\n');
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            alert(`🛒 Order Sent!\n\nItems:\n${summary}\n\nTotal Due: ${total.toLocaleString()} MMK\n\nTake a screenshot of this window and send it over to complete payment setup!`);
        }

        renderProducts();
        updateUI();
    </script>
</body>
</html>
